name: release

# Změna versionName v AndroidManifest.xml na main → podepsané APK v GitHub Releases (tag v<verze>).
# Hodiny si ho stáhnou přes ⚙ Nastavení → ⟳ Aktualizovat. Když release pro verzi už existuje, nic se neděje.
# Ruční spuštění: Actions → release → Run workflow.
on:
  push:
    branches: [main]
    paths: ['AndroidManifest.xml', 'src/**', 'res/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verze
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER už existuje – pro nové vydání zvyš versionName."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Android nástroje
        if: steps.ver.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange apksigner zipalign

      - name: Podpisový klíč
        if: steps.ver.outputs.skip != '1'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Chybí secret KEYSTORE_B64"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > hodiny.keystore
          echo "sha256 klíče: $(sha256sum hodiny.keystore | cut -d' ' -f1)"
          if ! keytool -list -keystore hodiny.keystore -storepass hodiny >/dev/null 2>&1; then
            echo "::error::KEYSTORE_B64 není platný keystore – vlož výstup 'base64 -w0 hodiny.keystore' (jeden řádek, nic navíc)"
            exit 1
          fi

      - name: Sestavení
        if: steps.ver.outputs.skip != '1'
        run: ./build.sh

      - name: Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.ver.outputs.ver }}
          cp Hodiny.apk "Hodiny-$VER.apk"
          gh release create "v$VER" "Hodiny-$VER.apk" --target "$GITHUB_SHA" --title "Hodiny $VER" \
            --notes "$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')"
